name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm provenance: proves the package was built from this repo
# vibe-tax is not published: npm rejects it as too similar to vibetax, which also keeps it away from squatters.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      # no token: npm trusts this workflow via OIDC (npmjs.com > vibetax > trusted publisher).
      # stage, don't publish: the tarball waits for `npm stage approve` and a human 2FA prompt,
      # so a compromised pipeline cannot ship to users on its own.
      - run: npm stage publish . --provenance --access public
